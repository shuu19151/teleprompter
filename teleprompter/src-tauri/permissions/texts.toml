[[permission]]
identifier = "allow-texts-list"
description = "Enables the texts_list command."
commands.allow = ["texts_list"]

[[permission]]
identifier = "allow-texts-read"
description = "Enables the texts_read command."
commands.allow = ["texts_read"]

[[permission]]
identifier = "allow-texts-write"
description = "Enables the texts_write command."
commands.allow = ["texts_write"]

[[permission]]
identifier = "allow-texts-delete"
description = "Enables the texts_delete command."
commands.allow = ["texts_delete"]

[[permission]]
identifier = "allow-texts-folder"
description = "Reads and changes the selected text library and reads legacy texts for migration."
commands.allow = ["texts_folder", "texts_set_folder", "texts_legacy_list"]
