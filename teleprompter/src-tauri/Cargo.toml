[package]
name = "app"
version = "0.1.0"
description = "A local teleprompter for reading spoken English essays aloud."
authors = ["shuu19151"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.3"
cpal = "0.18.2"
hound = "3.5.1"
rtrb = "0.4.1"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rubato = "5.1.0"
audioadapter-buffers = "5.2.0"
uuid = { version = "1.29.3", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62"
