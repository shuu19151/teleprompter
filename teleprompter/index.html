<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teleprompter</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f4ebe0'/%3E%3Crect x='7' y='8' width='18' height='3' rx='1.5' fill='%23d0683a'/%3E%3Crect x='7' y='14.5' width='14' height='3' rx='1.5' fill='%231d1b18'/%3E%3Crect x='7' y='21' width='16' height='3' rx='1.5' fill='%23d0683a'/%3E%3C/svg%3E" />
    <script>
      try {
        var saved = localStorage.getItem('teleprompter:theme')
        if (saved === null) saved = localStorage.getItem('office-essay:theme')
        if (JSON.parse(saved) === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
