<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telepromter</title>
    <script>
      try {
        var saved = localStorage.getItem('teleprompter:theme')
        if (saved === null) saved = localStorage.getItem('office-essay:theme')
        if (JSON.parse(saved) === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
